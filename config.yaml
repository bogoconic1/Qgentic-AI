llm:
  main_agent_model: "gpt-5.5"
  developer_tool_model: "gpt-5.5"
runtime:
  llm_max_retries: 5
  llm_backoff_sequence: [1, 5, 10, 30, 60]
  compaction_threshold_tokens: 200000  # compact when last call's prompt_token_count exceeds this
  compaction_keep_last: 4               # turns kept verbatim after summary
  baseline_code_timeout: 43200  # 12 hours for baseline code execution
  log_monitor_interval: 300  # Seconds between codex monitor calls during code execution
  monitor_codex_timeout: 600  # Kill a wedged monitor codex call so the job's own hard timeout stays live
  bash_timeout_seconds: 600  # Per-call timeout for the bash filesystem tool
subagents:
  codex:
    model: "gpt-5.6-sol"        # passed to `codex exec -m`; no fallback in code
    sandbox: "workspace-write"  # shell has no network; codex's web search still works
paths:
  task_root: "task"
tracking:
  wandb:
    entity: bogoconic1 # replace with your W&B entity
    project: qgentic-ai # replace with your W&B project
